name: Tooling checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: python -m pytest -q
      - run: python scripts/check-source-tree.py
      - run: python -m pip wheel --no-deps .
