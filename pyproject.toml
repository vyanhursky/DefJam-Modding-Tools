[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defjam-modding-tools"
version = "0.1.0"
description = "Local texture restoration and model review for Def Jam: Fight for NY"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Vlad Yanhursky"}]
dependencies = ["Pillow>=10,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
defjam-tools = "defjam_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
defjam_tools = ["resources/*", "resources/profiles/*.json", "resources/vendor/three/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
